# Every version here matches ~/repos/fyi-player so the shared ~/.gradle cache already holds it.
# Check the cache before changing one: this machine has little free disk.
[versions]
agp = "8.13.0"
kotlin = "2.4.0"
ksp = "2.3.9"
composeBom = "2026.06.01"
activityCompose = "1.10.1"
coreKtx = "1.16.0"
material3 = "1.4.0"
room = "2.8.4"
navigationCompose = "2.9.7"
junit = "4.13.2"
lifecycleRuntime = "2.9.4"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
# icons left the BOM; last standalone release. Core set only: the extended set is not in the cache.
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version = "1.7.8" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntime" }
junit = { module = "junit:junit", version.ref = "junit" }
